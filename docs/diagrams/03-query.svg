<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1380" width="1600" height="1380">
  <title>Overfit query, selection, and generation paths</title>
  <desc>The implemented read commands: direct vector search, course-wide clustering, topic-focused MMR, diagnostics, and the schema-validated mock exam generation path.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.08"/></filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563EB"/></marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748B"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#059669"/></marker>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
      .h1{font-size:34px;font-weight:750;fill:#0F172A}.sub{font-size:15px;fill:#475569}.eyebrow{font-size:11px;font-weight:750;letter-spacing:1.45px}.title{font-size:20px;font-weight:750}.body{font-size:13px;fill:#475569}.small{font-size:11.5px;fill:#64748B}.code{font-size:11.8px;fill:#334155}.step{font-size:12px;font-weight:750;fill:#FFFFFF}
    </style>
  </defs>
  <rect width="1600" height="1380" fill="#F8FAFC"/>

  <g id="header" class="sans">
    <text x="64" y="62" class="h1">Stage 3 · Query, Selection &amp; Generation</text>
    <text x="64" y="92" class="sub">The read side has different algorithms for a direct question and for whole-artifact coverage. Only mock crosses the LLM boundary.</text>
    <rect x="1410" y="43" width="126" height="31" rx="15.5" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="1473" y="63" text-anchor="middle" font-size="12" font-weight="700" fill="#1D4ED8">LAYERS 6—7</text>
    <line x1="64" y1="116" x2="1536" y2="116" stroke="#CBD5E1"/>
  </g>

  <g id="common-entry" class="sans">
    <rect x="64" y="142" width="1472" height="112" rx="16" fill="#FFFFFF" stroke="#93C5FD"/>
    <rect x="64" y="142" width="8" height="112" rx="4" fill="#3B82F6"/>
    <text x="92" y="172" class="eyebrow" fill="#2563EB">COMMON ENTRY FOR EVERY INDEX-BACKED COMMAND</text>
    <text x="92" y="202" class="title" fill="#1E3A8A">Probe dimension → build live profile → verify existing course index</text>
    <text x="92" y="229" class="body">This means search, topics, coverage, status, and mock all require the configured embedding endpoint to answer before the index opens.</text>
    <rect x="1218" y="167" width="290" height="59" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="1236" y="189" font-size="11" font-weight="750" fill="#1D4ED8">SHARED EMBEDDER</text>
    <text x="1236" y="211" class="small mono">same EMBED_* config as ingestion</text>
  </g>

  <g id="selection-paths" class="sans">
    <text x="64" y="300" class="eyebrow" fill="#475569">CHOOSE THE PATH THAT MATCHES THE COMMAND</text>

    <g id="direct-search">
      <rect x="64" y="322" width="464" height="392" rx="18" fill="#FFFFFF" stroke="#93C5FD"/>
      <rect x="64" y="322" width="464" height="7" rx="3.5" fill="#3B82F6"/>
      <text x="88" y="359" class="eyebrow" fill="#2563EB">A · DIRECT RETRIEVAL</text>
      <text x="88" y="391" class="title" fill="#1E3A8A">search "query" --top-k K</text>
      <g>
        <circle cx="105" cy="438" r="15" fill="#2563EB"/><text x="105" y="443" text-anchor="middle" class="step">1</text>
        <text x="132" y="435" font-size="13.5" font-weight="700" fill="#1E3A8A">Embed the query</text><text x="132" y="454" class="small">one normalised vector</text>
        <line x1="105" y1="455" x2="105" y2="483" stroke="#BFDBFE" stroke-width="2"/>
        <circle cx="105" cy="500" r="15" fill="#2563EB"/><text x="105" y="505" text-anchor="middle" class="step">2</text>
        <text x="132" y="497" font-size="13.5" font-weight="700" fill="#1E3A8A">sqlite-vec nearest neighbours</text><text x="132" y="516" class="small">L2 rank over unit vectors</text>
        <line x1="105" y1="517" x2="105" y2="545" stroke="#BFDBFE" stroke-width="2"/>
        <circle cx="105" cy="562" r="15" fill="#2563EB"/><text x="105" y="567" text-anchor="middle" class="step">3</text>
        <text x="132" y="559" font-size="13.5" font-weight="700" fill="#1E3A8A">Return RetrievedChunk</text><text x="132" y="578" class="small">chunk + cosine score</text>
      </g>
      <rect x="88" y="608" width="416" height="77" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
      <text x="106" y="633" font-size="11" font-weight="750" fill="#1D4ED8">OUTPUT TO TERMINAL</text>
      <text x="106" y="655" class="code mono">rank · score · source/page · text preview</text>
      <text x="106" y="674" class="small">No re-ranker, keyword search, or query rewriting.</text>
    </g>

    <g id="course-coverage">
      <rect x="568" y="322" width="464" height="392" rx="18" fill="#FFFFFF" stroke="#93C5FD"/>
      <rect x="568" y="322" width="464" height="7" rx="3.5" fill="#0EA5E9"/>
      <text x="592" y="359" class="eyebrow" fill="#0284C7">B · WHOLE-COURSE COVERAGE</text>
      <text x="592" y="391" class="title" fill="#0C4A6E">No query: shape the corpus</text>
      <g>
        <circle cx="609" cy="438" r="15" fill="#0284C7"/><text x="609" y="443" text-anchor="middle" class="step">1</text>
        <text x="636" y="435" font-size="13.5" font-weight="700" fill="#0C4A6E">Load all stored embeddings</text><text x="636" y="454" class="small">generation selection only</text>
        <line x1="609" y1="455" x2="609" y2="483" stroke="#BAE6FD" stroke-width="2"/>
        <circle cx="609" cy="500" r="15" fill="#0284C7"/><text x="609" y="505" text-anchor="middle" class="step">2</text>
        <text x="636" y="497" font-size="13.5" font-weight="700" fill="#0C4A6E">Cluster into up to 12 topics</text><text x="636" y="516" class="small">farthest seeds + ≤6 Lloyd passes</text>
        <line x1="609" y1="517" x2="609" y2="545" stroke="#BAE6FD" stroke-width="2"/>
        <circle cx="609" cy="562" r="15" fill="#0284C7"/><text x="609" y="567" text-anchor="middle" class="step">3</text>
        <text x="636" y="559" font-size="13.5" font-weight="700" fill="#0C4A6E">Allocate and select</text><text x="636" y="578" class="small">distinct-file weight + largest remainder</text>
      </g>
      <rect x="592" y="608" width="416" height="77" rx="10" fill="#F0F9FF" stroke="#BAE6FD"/>
      <text x="610" y="633" font-size="11" font-weight="750" fill="#0369A1">USED BY</text>
      <text x="610" y="655" class="code mono">topics · coverage · mock (without --topic)</text>
      <text x="610" y="674" class="small">Representatives favour central, substantial passages.</text>
    </g>

    <g id="topic-selection">
      <rect x="1072" y="322" width="464" height="392" rx="18" fill="#FFFFFF" stroke="#93C5FD"/>
      <rect x="1072" y="322" width="464" height="7" rx="3.5" fill="#06B6D4"/>
      <text x="1096" y="359" class="eyebrow" fill="#0891B2">C · TOPIC-FOCUSED COVERAGE</text>
      <text x="1096" y="391" class="title" fill="#164E63">Relevant, but not repetitive</text>
      <g>
        <circle cx="1113" cy="438" r="15" fill="#0891B2"/><text x="1113" y="443" text-anchor="middle" class="step">1</text>
        <text x="1140" y="435" font-size="13.5" font-weight="700" fill="#164E63">Embed topic text</text><text x="1140" y="454" class="small">same query embedder</text>
        <line x1="1113" y1="455" x2="1113" y2="483" stroke="#A5F3FC" stroke-width="2"/>
        <circle cx="1113" cy="500" r="15" fill="#0891B2"/><text x="1113" y="505" text-anchor="middle" class="step">2</text>
        <text x="1140" y="497" font-size="13.5" font-weight="700" fill="#164E63">Retrieve a wider pool</text><text x="1140" y="516" class="small">default pool 40</text>
        <line x1="1113" y1="517" x2="1113" y2="545" stroke="#A5F3FC" stroke-width="2"/>
        <circle cx="1113" cy="562" r="15" fill="#0891B2"/><text x="1113" y="567" text-anchor="middle" class="step">3</text>
        <text x="1140" y="559" font-size="13.5" font-weight="700" fill="#164E63">MMR on stored vectors</text><text x="1140" y="578" class="small">min-max scaled · diversity 0.4</text>
      </g>
      <rect x="1096" y="608" width="416" height="77" rx="10" fill="#ECFEFF" stroke="#A5F3FC"/>
      <text x="1114" y="633" font-size="11" font-weight="750" fill="#0E7490">USED BY</text>
      <text x="1114" y="655" class="code mono">coverage --topic · mock --topic</text>
      <text x="1114" y="674" class="small">Final passages are sorted by source and first page.</text>
    </g>
  </g>

  <g id="non-generating-outputs" class="sans">
    <rect x="64" y="752" width="968" height="174" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="88" y="785" class="eyebrow" fill="#475569">READ-ONLY OUTPUTS · NO GENERATION MODEL</text>
    <g>
      <rect x="88" y="807" width="282" height="93" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="106" y="832" font-size="13" font-weight="700" fill="#0F172A">topics</text>
      <text x="106" y="853" class="small">representative label · files · chunks</text>
      <text x="106" y="872" class="small">question allocation preview</text>
      <text x="106" y="891" class="small mono">stdout only</text>
      <rect x="384" y="807" width="322" height="93" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="402" y="832" font-size="13" font-weight="700" fill="#0F172A">coverage</text>
      <text x="402" y="853" class="small">selected citations + text previews</text>
      <text x="402" y="872" class="small">spread count by source</text>
      <text x="402" y="891" class="small mono">stdout only</text>
      <rect x="720" y="807" width="288" height="93" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="738" y="832" font-size="13" font-weight="700" fill="#0F172A">status</text>
      <text x="738" y="853" class="small">profile · counts · source rows</text>
      <text x="738" y="872" class="small">direct store introspection</text>
      <text x="738" y="891" class="small mono">stdout only</text>
    </g>
  </g>

  <g id="mock-entry" class="sans">
    <rect x="1072" y="752" width="464" height="174" rx="18" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="1096" y="785" class="eyebrow" fill="#047857">MOCK MATERIAL BUDGET</text>
    <text x="1096" y="817" class="title" fill="#065F46">selected passages → Generator</text>
    <text x="1096" y="847" class="body">Default passage budget = questions × 2</text>
    <text x="1096" y="870" class="body">Override with <tspan class="mono">--material</tspan>.</text>
    <text x="1096" y="893" class="small">The model may return fewer questions or an explicit empty list.</text>
  </g>

  <path d="M1304 926V956H800" fill="none" stroke="#059669" stroke-width="2.3" marker-end="url(#arrow-green)"/>

  <g id="generator" class="sans">
    <rect x="64" y="970" width="1472" height="316" rx="18" fill="#FFFFFF" stroke="#A7F3D0"/>
    <rect x="64" y="970" width="1472" height="7" rx="3.5" fill="#10B981"/>
    <text x="88" y="1008" class="eyebrow" fill="#047857">LAYER 7 · GENERATOR · mock ONLY</text>
    <g>
      <rect x="88" y="1031" width="326" height="198" rx="13" fill="#ECFDF5" stroke="#A7F3D0"/>
      <circle cx="115" cy="1061" r="15" fill="#059669"/><text x="115" y="1066" text-anchor="middle" class="step">1</text>
      <text x="142" y="1066" font-size="14" font-weight="750" fill="#065F46">Assemble prompt</text>
      <text x="110" y="1097" class="body">Jinja2 system + mock templates</text>
      <text x="110" y="1120" class="body">Every passage is labelled with</text>
      <text x="110" y="1142" class="body">its exact citation.</text>
      <rect x="110" y="1163" width="282" height="45" rx="8" fill="#D1FAE5"/>
      <text x="126" y="1183" class="code mono">[week03/lecture.pdf p12]</text>
      <text x="126" y="1200" class="small">source text follows</text>

      <rect x="432" y="1031" width="326" height="198" rx="13" fill="#ECFDF5" stroke="#A7F3D0"/>
      <circle cx="459" cy="1061" r="15" fill="#059669"/><text x="459" y="1066" text-anchor="middle" class="step">2</text>
      <text x="486" y="1066" font-size="14" font-weight="750" fill="#065F46">Stream completion</text>
      <text x="454" y="1097" class="body">OpenAI-compatible chat endpoint</text>
      <text x="454" y="1120" class="body">with configured temperature.</text>
      <text x="454" y="1142" class="body">Response-format ladder:</text>
      <text x="454" y="1169" class="small mono">json_schema (first attempt)</text>
      <text x="454" y="1189" class="small mono">→ json_object → unconstrained</text>
      <text x="454" y="1211" class="small">Answer and reasoning stream updates are surfaced.</text>

      <rect x="776" y="1031" width="326" height="198" rx="13" fill="#ECFDF5" stroke="#A7F3D0"/>
      <circle cx="803" cy="1061" r="15" fill="#059669"/><text x="803" y="1066" text-anchor="middle" class="step">3</text>
      <text x="830" y="1066" font-size="14" font-weight="750" fill="#065F46">Parse + validate + retry</text>
      <text x="798" y="1097" class="body">Extract JSON, accept unambiguous</text>
      <text x="798" y="1120" class="body">wrapper variants, then validate</text>
      <text x="798" y="1142" class="body">GeneratedExam with Pydantic.</text>
      <text x="798" y="1169" class="small">Default maximum: 4 attempts.</text>
      <text x="798" y="1191" class="small">Validation error is sent back to the</text>
      <text x="798" y="1209" class="small">model as a correction request.</text>

      <rect x="1120" y="1031" width="392" height="198" rx="13" fill="#ECFDF5" stroke="#A7F3D0"/>
      <circle cx="1147" cy="1061" r="15" fill="#059669"/><text x="1147" y="1066" text-anchor="middle" class="step">4</text>
      <text x="1174" y="1066" font-size="14" font-weight="750" fill="#065F46">Check citations + render</text>
      <text x="1142" y="1097" class="body">Drop unknown sources. Repair a page</text>
      <text x="1142" y="1120" class="body">to the nearest supplied page only when</text>
      <text x="1142" y="1142" class="body">the difference is ≤2; otherwise drop.</text>
      <text x="1142" y="1169" class="small">Group items by topic; render separate paper</text>
      <text x="1142" y="1187" class="small">and answer-key Markdown files.</text>
      <text x="1142" y="1211" class="small mono">outputs/&lt;course&gt;_{mock_exam,answers}.md</text>
    </g>
    <path d="M414 1130H422" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
    <path d="M758 1130H766" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
    <path d="M1102 1130H1110" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  </g>

  <g id="truth-boundary" class="sans">
    <rect x="64" y="1314" width="1472" height="38" rx="9" fill="#FFF7ED" stroke="#FED7AA"/>
    <text x="800" y="1338" text-anchor="middle" font-size="12" font-weight="700" fill="#9A3412">Citation validation proves that a cited source/page was supplied; it does not prove the generated answer is semantically supported.</text>
  </g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1320" width="1600" height="1320">
  <title>Overfit verification and diagnostics</title>
  <desc>The actual current automated test scope, lint status, runtime diagnostic commands, manual checks, and explicitly unimplemented evaluation capabilities.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.08"/></filter>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
      .h1{font-size:34px;font-weight:750;fill:#0F172A}.sub{font-size:15px;fill:#475569}.eyebrow{font-size:11px;font-weight:750;letter-spacing:1.45px}.title{font-size:20px;font-weight:750}.body{font-size:13px;fill:#475569}.small{font-size:11.5px;fill:#64748B}.code{font-size:11.8px;fill:#334155}.status{font-size:11px;font-weight:750;letter-spacing:.6px}
    </style>
  </defs>
  <rect width="1600" height="1320" fill="#F8FAFC"/>

  <g id="header" class="sans">
    <text x="64" y="62" class="h1">Verification &amp; Diagnostics · Current Reality</text>
    <text x="64" y="92" class="sub">Overfit exposes useful seam-by-seam probes, but it does not yet implement a retrieval benchmark or automated answer-quality evaluator.</text>
    <rect x="1370" y="43" width="166" height="31" rx="15.5" fill="#ECFDF5" stroke="#A7F3D0"/>
    <circle cx="1390" cy="58.5" r="5" fill="#10B981"/>
    <text x="1404" y="63" font-size="12" font-weight="700" fill="#047857">EVIDENCE, NOT CLAIMS</text>
    <line x1="64" y1="116" x2="1536" y2="116" stroke="#CBD5E1"/>
  </g>

  <g id="snapshot" class="sans">
    <rect x="64" y="142" width="1472" height="118" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="88" y="173" class="eyebrow" fill="#475569">REPOSITORY SNAPSHOT · DOCUMENTATION SYNC</text>
    <g>
      <rect x="88" y="191" width="312" height="46" rx="10" fill="#ECFDF5" stroke="#A7F3D0"/>
      <text x="106" y="210" class="status" fill="#047857">PYTEST · PASS</text>
      <text x="106" y="228" class="small mono">5 passed · tests/test_parser.py</text>
      <rect x="416" y="191" width="312" height="46" rx="10" fill="#ECFDF5" stroke="#A7F3D0"/>
      <text x="434" y="210" class="status" fill="#047857">RUFF · PASS</text>
      <text x="434" y="228" class="small mono">0 findings · local check clean</text>
      <rect x="744" y="191" width="352" height="46" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="762" y="210" class="status" fill="#475569">CI WORKFLOW · ABSENT</text>
      <text x="762" y="228" class="small">No repository-hosted automated gate.</text>
      <rect x="1112" y="191" width="396" height="46" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="1130" y="210" class="status" fill="#475569">EVALUATION DATASET · ABSENT</text>
      <text x="1130" y="228" class="small">No labelled queries, gold passages, or judged answers.</text>
    </g>
  </g>

  <g id="automated-tests" class="sans">
    <rect x="64" y="296" width="712" height="422" rx="18" fill="#FFFFFF" stroke="#A7F3D0"/>
    <rect x="64" y="296" width="712" height="7" rx="3.5" fill="#10B981"/>
    <text x="88" y="335" class="eyebrow" fill="#047857">AUTOMATED TEST SUITE · ACTUAL SCOPE</text>
    <text x="88" y="367" class="title" fill="#065F46">Five silent-failure invariants in Parser</text>
    <text x="88" y="392" class="body">All tests use synthetic Page objects except the blank text-file case.</text>

    <g>
      <circle cx="105" cy="435" r="15" fill="#D1FAE5"/><text x="105" y="440" text-anchor="middle" font-size="12" font-weight="750" fill="#047857">1</text>
      <text x="132" y="431" font-size="12.8" font-weight="700" fill="#0F172A">Page numbers survive cleaning</text>
      <text x="132" y="449" class="small">Even a page cleaned to empty keeps its original slot.</text>
      <circle cx="105" cy="488" r="15" fill="#D1FAE5"/><text x="105" y="493" text-anchor="middle" font-size="12" font-weight="750" fill="#047857">2</text>
      <text x="132" y="484" font-size="12.8" font-weight="700" fill="#0F172A">Labelled structure is not figure debris</text>
      <text x="132" y="502" class="small">Docling-recognised cells survive while identical unlabelled debris is removed.</text>
      <circle cx="105" cy="541" r="15" fill="#D1FAE5"/><text x="105" y="546" text-anchor="middle" font-size="12" font-weight="750" fill="#047857">3</text>
      <text x="132" y="537" font-size="12.8" font-weight="700" fill="#0F172A">Labelled furniture outranks frequency heuristics</text>
      <text x="132" y="555" class="small">Backend labels work on short documents and away from page edges.</text>
      <circle cx="105" cy="594" r="15" fill="#D1FAE5"/><text x="105" y="599" text-anchor="middle" font-size="12" font-weight="750" fill="#047857">4</text>
      <text x="132" y="590" font-size="12.8" font-weight="700" fill="#0F172A">Hyphenated line breaks are rejoined</text>
      <text x="132" y="608" class="small">A split keyword remains searchable after normalisation.</text>
      <circle cx="105" cy="647" r="15" fill="#D1FAE5"/><text x="105" y="652" text-anchor="middle" font-size="12" font-weight="750" fill="#047857">5</text>
      <text x="132" y="643" font-size="12.8" font-weight="700" fill="#0F172A">Blank extraction fails loudly</text>
      <text x="132" y="661" class="small">A blank text document raises EmptyExtractionError.</text>
    </g>
    <rect x="88" y="681" width="664" height="19" rx="6" fill="#ECFDF5"/>
    <text x="420" y="695" text-anchor="middle" class="small mono">uv run pytest -q</text>
  </g>

  <g id="coverage-gaps" class="sans">
    <rect x="812" y="296" width="724" height="422" rx="18" fill="#FFFFFF" stroke="#FDA4AF"/>
    <rect x="812" y="296" width="724" height="7" rx="3.5" fill="#F43F5E"/>
    <text x="836" y="335" class="eyebrow" fill="#E11D48">NOT COVERED BY AUTOMATED TESTS</text>
    <text x="836" y="367" class="title" fill="#881337">Passing pytest does not validate the full pipeline</text>
    <g>
      <rect x="836" y="397" width="322" height="64" rx="10" fill="#FFF1F2" stroke="#FECDD3"/>
      <text x="854" y="421" font-size="12.5" font-weight="700" fill="#9F1239">Loader + cache behaviour</text>
      <text x="854" y="442" class="small">discovery, hashes, re-ingest, stale files</text>
      <rect x="1172" y="397" width="340" height="64" rx="10" fill="#FFF1F2" stroke="#FECDD3"/>
      <text x="1190" y="421" font-size="12.5" font-weight="700" fill="#9F1239">Chunker</text>
      <text x="1190" y="442" class="small">continuation, breakpoints, overlap, IDs</text>
      <rect x="836" y="477" width="322" height="64" rx="10" fill="#FFF1F2" stroke="#FECDD3"/>
      <text x="854" y="501" font-size="12.5" font-weight="700" fill="#9F1239">Embedding + storage</text>
      <text x="854" y="522" class="small">normalisation, retries, schema, search math</text>
      <rect x="1172" y="477" width="340" height="64" rx="10" fill="#FFF1F2" stroke="#FECDD3"/>
      <text x="1190" y="501" font-size="12.5" font-weight="700" fill="#9F1239">Retriever + selection</text>
      <text x="1190" y="522" class="small">top-k, clustering, allocation, MMR</text>
      <rect x="836" y="557" width="322" height="64" rx="10" fill="#FFF1F2" stroke="#FECDD3"/>
      <text x="854" y="581" font-size="12.5" font-weight="700" fill="#9F1239">Generator</text>
      <text x="854" y="602" class="small">format fallback, coercion, retries, citations</text>
      <rect x="1172" y="557" width="340" height="64" rx="10" fill="#FFF1F2" stroke="#FECDD3"/>
      <text x="1190" y="581" font-size="12.5" font-weight="700" fill="#9F1239">CLI + end-to-end flow</text>
      <text x="1190" y="602" class="small">commands, files, model endpoints, DB lifecycle</text>
    </g>
    <rect x="836" y="646" width="676" height="48" rx="9" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="854" y="666" font-size="11.5" font-weight="700" fill="#047857">Ruff passes locally, but no repository-hosted CI gate enforces it.</text>
    <text x="854" y="684" class="small mono">uv run ruff check .   # 0 findings</text>
  </g>

  <g id="runtime-diagnostics" class="sans">
    <rect x="64" y="754" width="1472" height="440" rx="18" fill="#FFFFFF" stroke="#93C5FD"/>
    <text x="88" y="790" class="eyebrow" fill="#2563EB">RUNTIME DIAGNOSTIC LADDER · IMPLEMENTED CLI COMMANDS</text>
    <text x="88" y="817" class="body">These are observable probes for a human operator. Unless noted, they report evidence rather than compute pass/fail.</text>

    <g id="diagnostic-row-1">
      <rect x="88" y="842" width="216" height="91" rx="11" fill="#F5F3FF" stroke="#DDD6FE"/>
      <text x="106" y="869" font-size="12.5" font-weight="750" fill="#6D28D9">01 · inspect</text>
      <text x="106" y="891" class="small">Loader + Parser</text>
      <text x="106" y="913" class="small mono">--show-removed</text>
      <text x="330" y="867" font-size="12.5" font-weight="700" fill="#0F172A">Extraction reality</text>
      <text x="330" y="889" class="body">documents, ignored extensions, pages, chars, median/page, sparse-page warning, longest-page samples</text>
      <text x="330" y="911" class="small">Optional cleaning audit lists deleted furniture, page-number lines, and figure debris.</text>
    </g>
    <line x1="88" y1="944" x2="1512" y2="944" stroke="#E2E8F0"/>

    <g id="diagnostic-row-2">
      <rect x="88" y="958" width="216" height="70" rx="11" fill="#F5F3FF" stroke="#DDD6FE"/>
      <text x="106" y="985" font-size="12.5" font-weight="750" fill="#6D28D9">02 · chunks</text>
      <text x="106" y="1007" class="small">Chunker preview</text>
      <text x="330" y="979" font-size="12.5" font-weight="700" fill="#0F172A">Boundary quality</text>
      <text x="330" y="1001" class="body">per-file and total chunk counts, min/median/max characters, page-spanning count, readable samples</text>
      <text x="330" y="1021" class="small">Use <tspan class="mono">--spanning</tspan> to inspect only chunks crossing page breaks.</text>
    </g>
    <line x1="88" y1="1039" x2="1512" y2="1039" stroke="#E2E8F0"/>

    <g id="diagnostic-row-3">
      <rect x="88" y="1053" width="216" height="70" rx="11" fill="#F5F3FF" stroke="#DDD6FE"/>
      <text x="106" y="1080" font-size="12.5" font-weight="750" fill="#6D28D9">03 · embed-check</text>
      <text x="106" y="1102" class="small">Embedder probe</text>
      <text x="330" y="1074" font-size="12.5" font-weight="700" fill="#0F172A">Endpoint + semantic sanity</text>
      <text x="330" y="1096" class="body">model URL, dimension, and six cosine probes: paraphrase, same topic, neighbour, Chinese query, unrelated, nonsense</text>
      <text x="330" y="1116" class="small">Connection failure is fatal; relative score ordering is interpreted by a human, not asserted.</text>
    </g>
    <line x1="88" y1="1134" x2="1512" y2="1134" stroke="#E2E8F0"/>

    <g id="diagnostic-row-4">
      <rect x="88" y="1148" width="216" height="28" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
      <text x="106" y="1167" font-size="12.2" font-weight="750" fill="#1D4ED8">04 · post-index probes</text>
      <text x="330" y="1160" font-size="12.5" font-weight="700" fill="#0F172A">ingest · status · search · topics · coverage · mock</text>
      <text x="330" y="1180" class="small">Counts/profile → retrieval ranks → topic weights → material spread → schema attempts, discarded citations, final topics/files.</text>
    </g>
  </g>

  <g id="missing-evaluation" class="sans">
    <rect x="64" y="1228" width="1472" height="58" rx="13" fill="#0F172A"/>
    <text x="88" y="1252" class="eyebrow" fill="#FDA4AF">NOT IMPLEMENTED · DO NOT INFER FROM THE DIAGNOSTICS ABOVE</text>
    <text x="88" y="1274" font-size="12" fill="#E2E8F0">gold query/passage set · recall@k / MRR · automated redundancy or coverage score · factual-support judge · answer-quality benchmark · RAGAS · model comparison harness</text>
  </g>
</svg>

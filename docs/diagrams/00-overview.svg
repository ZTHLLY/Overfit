<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" width="1600" height="1040">
  <title>Overfit current system overview</title>
  <desc>Current command surface and data flow from course documents through ingestion, a per-course SQLite vector index, retrieval and mock exam generation.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.08"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6366F1"/></marker>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
      .h1{font-size:34px;font-weight:750;fill:#0F172A}.sub{font-size:15px;fill:#475569}.eyebrow{font-size:11px;font-weight:750;letter-spacing:1.5px}.title{font-size:21px;font-weight:750}.body{font-size:13px;fill:#475569}.small{font-size:11.5px;fill:#64748B}.code{font-size:12px;fill:#334155}.label{font-size:11px;font-weight:700;letter-spacing:.8px}
    </style>
  </defs>
  <rect width="1600" height="1040" fill="#F8FAFC"/>

  <g id="header" class="sans">
    <text x="64" y="62" class="h1">Overfit · Current System Map</text>
    <text x="64" y="92" class="sub">A local-first, hand-written RAG CLI. One index per course; only the mock command calls a generation model.</text>
    <rect x="1372" y="43" width="164" height="31" rx="15.5" fill="#EEF2FF" stroke="#C7D2FE"/>
    <circle cx="1391" cy="58.5" r="5" fill="#22C55E"/>
    <text x="1404" y="63" font-size="12" font-weight="700" fill="#4338CA">IMPLEMENTED · 0.1.0</text>
    <line x1="64" y1="116" x2="1536" y2="116" stroke="#CBD5E1"/>
  </g>

  <g id="command-surface" class="sans">
    <rect x="64" y="142" width="1472" height="108" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="88" y="171" class="eyebrow" fill="#6366F1">TYPER CLI · NINE COMMANDS</text>
    <g id="pre-index-commands">
      <rect x="88" y="188" width="340" height="42" rx="9" fill="#F5F3FF" stroke="#DDD6FE"/>
      <text x="104" y="207" class="label" fill="#6D28D9">BEFORE INDEXING</text>
      <text x="104" y="223" class="code mono">inspect · chunks · embed-check</text>
    </g>
    <g id="write-command">
      <rect x="444" y="188" width="242" height="42" rx="9" fill="#FAF5FF" stroke="#D8B4FE"/>
      <text x="460" y="207" class="label" fill="#7E22CE">BUILD / UPDATE</text>
      <text x="460" y="223" class="code mono">ingest</text>
    </g>
    <g id="read-commands">
      <rect x="702" y="188" width="810" height="42" rx="9" fill="#EFF6FF" stroke="#BFDBFE"/>
      <text x="718" y="207" class="label" fill="#1D4ED8">READ / GENERATE</text>
      <text x="718" y="223" class="code mono">search · topics · coverage · status · mock</text>
    </g>
  </g>

  <g id="main-flow" class="sans">
    <g id="sources">
      <rect x="64" y="296" width="232" height="368" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
      <rect x="64" y="296" width="232" height="7" rx="3.5" fill="#64748B"/>
      <text x="88" y="337" class="eyebrow" fill="#64748B">INPUT</text>
      <text x="88" y="371" class="title" fill="#0F172A">Course material</text>
      <text x="88" y="400" class="body">Recursively discovered</text>
      <text x="88" y="419" class="body">under one course folder.</text>
      <g class="mono">
        <rect x="88" y="449" width="184" height="31" rx="7" fill="#F1F5F9"/><text x="101" y="469" class="code">.pdf</text>
        <rect x="88" y="489" width="184" height="31" rx="7" fill="#F1F5F9"/><text x="101" y="509" class="code">.md · .markdown</text>
        <rect x="88" y="529" width="184" height="31" rx="7" fill="#F1F5F9"/><text x="101" y="549" class="code">.txt</text>
      </g>
      <text x="88" y="590" class="small">Default filter: <tspan class="mono">.pdf</tspan></text>
      <text x="88" y="608" class="small">Hidden and known junk</text>
      <text x="88" y="625" class="small">directories are skipped.</text>
      <text x="88" y="648" class="small mono">courses/&lt;course&gt;/</text>
    </g>

    <g id="ingestion">
      <rect x="344" y="296" width="350" height="368" rx="18" fill="#FFFFFF" stroke="#C4B5FD"/>
      <rect x="344" y="296" width="350" height="7" rx="3.5" fill="#8B5CF6"/>
      <text x="368" y="337" class="eyebrow" fill="#7C3AED">INGESTION · WRITE PATH</text>
      <text x="368" y="371" class="title" fill="#4C1D95">Documents → vectors</text>
      <g>
        <circle cx="382" cy="414" r="15" fill="#EDE9FE"/><text x="382" y="419" text-anchor="middle" font-size="12" font-weight="750" fill="#6D28D9">1</text>
        <text x="409" y="411" font-size="13.5" font-weight="700" fill="#4C1D95">Loader</text><text x="409" y="429" class="small">sorted paths + SHA-256</text>
        <line x1="382" y1="431" x2="382" y2="453" stroke="#C4B5FD" stroke-width="2"/>
        <circle cx="382" cy="468" r="15" fill="#EDE9FE"/><text x="382" y="473" text-anchor="middle" font-size="12" font-weight="750" fill="#6D28D9">2</text>
        <text x="409" y="465" font-size="13.5" font-weight="700" fill="#4C1D95">Parser + cleaning</text><text x="409" y="483" class="small">page-aware text + provenance</text>
        <line x1="382" y1="485" x2="382" y2="507" stroke="#C4B5FD" stroke-width="2"/>
        <circle cx="382" cy="522" r="15" fill="#EDE9FE"/><text x="382" y="527" text-anchor="middle" font-size="12" font-weight="750" fill="#6D28D9">3</text>
        <text x="409" y="519" font-size="13.5" font-weight="700" fill="#4C1D95">Boundary-aware chunker</text><text x="409" y="537" class="small">source + page range retained</text>
        <line x1="382" y1="539" x2="382" y2="561" stroke="#C4B5FD" stroke-width="2"/>
        <circle cx="382" cy="576" r="15" fill="#EDE9FE"/><text x="382" y="581" text-anchor="middle" font-size="12" font-weight="750" fill="#6D28D9">4</text>
        <text x="409" y="573" font-size="13.5" font-weight="700" fill="#4C1D95">Shared Embedder</text><text x="409" y="591" class="small">batch · retry · unit-normalise</text>
      </g>
      <rect x="368" y="616" width="302" height="29" rx="7" fill="#F5F3FF"/>
      <text x="519" y="635" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6D28D9">UNCHANGED FILES STOP AT THE HASH CACHE</text>
    </g>

    <g id="storage">
      <rect x="742" y="296" width="302" height="368" rx="18" fill="#FFFFFF" stroke="#FCD34D"/>
      <rect x="742" y="296" width="302" height="7" rx="3.5" fill="#F59E0B"/>
      <text x="766" y="337" class="eyebrow" fill="#B45309">STORAGE · LAYER 5</text>
      <text x="766" y="371" class="title" fill="#78350F">One SQLite file</text>
      <text x="766" y="398" class="body mono">index/&lt;course&gt;.db</text>
      <g>
        <rect x="766" y="428" width="254" height="44" rx="9" fill="#FFFBEB" stroke="#FDE68A"/>
        <text x="781" y="447" font-size="12.5" font-weight="700" fill="#92400E">chunks</text><text x="781" y="463" class="small">text + provenance</text>
        <rect x="766" y="481" width="254" height="44" rx="9" fill="#FFFBEB" stroke="#FDE68A"/>
        <text x="781" y="500" font-size="12.5" font-weight="700" fill="#92400E">vec_chunks</text><text x="781" y="516" class="small">sqlite-vec float vectors</text>
        <rect x="766" y="534" width="122" height="44" rx="9" fill="#FFFBEB" stroke="#FDE68A"/>
        <text x="781" y="553" font-size="12.5" font-weight="700" fill="#92400E">documents</text><text x="781" y="569" class="small">hash cache</text>
        <rect x="898" y="534" width="122" height="44" rx="9" fill="#FFFBEB" stroke="#FDE68A"/>
        <text x="913" y="553" font-size="12.5" font-weight="700" fill="#92400E">meta</text><text x="913" y="569" class="small">profile guard</text>
      </g>
      <text x="766" y="611" class="small">WAL enabled · joined by rowid</text>
      <text x="766" y="629" class="small">create on ingest · verify on open</text>
      <text x="766" y="647" class="small">profile mismatch fails loudly</text>
    </g>

    <g id="query">
      <rect x="1092" y="296" width="444" height="368" rx="18" fill="#FFFFFF" stroke="#93C5FD"/>
      <rect x="1092" y="296" width="444" height="7" rx="3.5" fill="#3B82F6"/>
      <text x="1116" y="337" class="eyebrow" fill="#2563EB">QUERY + ARTIFACT PATHS</text>
      <text x="1116" y="371" class="title" fill="#1E3A8A">One index, three read modes</text>
      <g>
        <rect x="1116" y="398" width="396" height="66" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
        <text x="1132" y="420" font-size="12.5" font-weight="750" fill="#1D4ED8">SEARCH</text>
        <text x="1132" y="439" class="body">embed query → sqlite-vec top-k</text>
        <text x="1132" y="456" class="small mono">search</text>
        <rect x="1116" y="476" width="396" height="76" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
        <text x="1132" y="498" font-size="12.5" font-weight="750" fill="#1D4ED8">COURSE COVERAGE</text>
        <text x="1132" y="517" class="body">all vectors → cluster → weighted allocation</text>
        <text x="1132" y="537" class="small mono">topics · coverage · mock (no topic)</text>
        <rect x="1116" y="564" width="396" height="76" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
        <text x="1132" y="586" font-size="12.5" font-weight="750" fill="#1D4ED8">TOPIC-FOCUSED MATERIAL</text>
        <text x="1132" y="605" class="body">wide vector search → MMR diversity</text>
        <text x="1132" y="625" class="small mono">coverage --topic · mock --topic</text>
      </g>
    </g>

    <path d="M296 480H334" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M694 480H732" fill="none" stroke="#6366F1" stroke-width="2.5" marker-end="url(#arrow-indigo)"/>
    <path d="M1044 480H1082" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="315" y="467" text-anchor="middle" class="small">read</text>
    <text x="713" y="467" text-anchor="middle" class="small">write</text>
    <text x="1063" y="467" text-anchor="middle" class="small">read</text>
  </g>

  <g id="runtime-services" class="sans">
    <rect x="64" y="708" width="980" height="120" rx="16" fill="#0F172A"/>
    <text x="88" y="739" class="eyebrow" fill="#A5B4FC">OPENAI-COMPATIBLE MODEL ENDPOINTS</text>
    <rect x="88" y="758" width="445" height="48" rx="9" fill="#1E293B" stroke="#475569"/>
    <text x="104" y="778" font-size="12.5" font-weight="700" fill="#E0E7FF">EMBEDDING · configured by EMBED_*</text>
    <text x="104" y="796" font-size="11.5" class="mono" fill="#CBD5E1">default bge-m3 · layers 4 + 6 · same vector space</text>
    <rect x="549" y="758" width="471" height="48" rx="9" fill="#1E293B" stroke="#475569"/>
    <text x="565" y="778" font-size="12.5" font-weight="700" fill="#E0E7FF">GENERATION · configured by LLM_*</text>
    <text x="565" y="796" font-size="11.5" class="mono" fill="#CBD5E1">default qwen3.6:27b · called by mock only</text>
    <text x="88" y="819" font-size="10.5" fill="#94A3B8">Ollama is the default; any compatible endpoint can be configured independently.</text>

    <rect x="1092" y="708" width="444" height="120" rx="16" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="1116" y="739" class="eyebrow" fill="#047857">MOCK OUTPUT</text>
    <text x="1116" y="770" font-size="13.5" font-weight="700" fill="#065F46">Schema-validated JSON → Jinja2</text>
    <text x="1116" y="793" class="code mono">outputs/&lt;course&gt;_mock_exam.md</text>
    <text x="1116" y="812" class="code mono">outputs/&lt;course&gt;_answers.md</text>
  </g>

  <g id="guarantees" class="sans">
    <rect x="64" y="870" width="1472" height="112" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="88" y="900" class="eyebrow" fill="#0F172A">LOAD-BEARING CONTRACTS</text>
    <circle cx="99" cy="937" r="14" fill="#EDE9FE"/><text x="99" y="942" text-anchor="middle" font-size="13" font-weight="750" fill="#6D28D9">1</text>
    <text x="124" y="933" font-size="12.5" font-weight="700" fill="#0F172A">Provenance travels with the chunk</text><text x="124" y="952" class="small">relative source path · first page · optional ending page</text>
    <circle cx="581" cy="937" r="14" fill="#FEF3C7"/><text x="581" y="942" text-anchor="middle" font-size="13" font-weight="750" fill="#B45309">2</text>
    <text x="606" y="933" font-size="12.5" font-weight="700" fill="#0F172A">Index profile is immutable</text><text x="606" y="952" class="small">model · dimension · chunk settings · parser backend</text>
    <circle cx="1032" cy="937" r="14" fill="#DBEAFE"/><text x="1032" y="942" text-anchor="middle" font-size="13" font-weight="750" fill="#1D4ED8">3</text>
    <text x="1057" y="933" font-size="12.5" font-weight="700" fill="#0F172A">Generated citations are checked</text><text x="1057" y="952" class="small">unknown source/page is repaired nearby or discarded</text>
  </g>
  <text x="64" y="1014" class="sans small">Solid arrows show persisted data flow. Diagnostics can inspect every seam without invoking the generation model.</text>
</svg>

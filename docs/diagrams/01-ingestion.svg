<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1370" width="1600" height="1370">
  <title>Overfit ingestion pipeline</title>
  <desc>The implemented ingest command from configuration and recursive file discovery through extraction, cleaning, chunking, embedding, caching, and persistence.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.08"/></filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7C3AED"/></marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748B"/></marker>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
      .h1{font-size:34px;font-weight:750;fill:#0F172A}.sub{font-size:15px;fill:#475569}.eyebrow{font-size:11px;font-weight:750;letter-spacing:1.45px}.title{font-size:20px;font-weight:750}.body{font-size:13px;fill:#475569}.small{font-size:11.5px;fill:#64748B}.code{font-size:11.8px;fill:#334155}.light{fill:#E2E8F0}.num{font-size:13px;font-weight:750;fill:#FFFFFF}
    </style>
  </defs>
  <rect width="1600" height="1370" fill="#F8FAFC"/>

  <g id="header" class="sans">
    <text x="64" y="62" class="h1">Stage 1 · Ingestion</text>
    <text x="64" y="92" class="sub">The implemented write path. Cache decisions happen per relative source path; provenance is created before vectors exist.</text>
    <rect x="1392" y="43" width="144" height="31" rx="15.5" fill="#F5F3FF" stroke="#DDD6FE"/>
    <text x="1464" y="63" text-anchor="middle" font-size="12" font-weight="700" fill="#6D28D9">LAYERS 1—4 + WRITE</text>
    <line x1="64" y1="116" x2="1536" y2="116" stroke="#CBD5E1"/>
  </g>

  <g id="initialise" class="sans">
    <rect x="64" y="142" width="1472" height="118" rx="16" fill="#FFFFFF" stroke="#C4B5FD"/>
    <rect x="64" y="142" width="8" height="118" rx="4" fill="#8B5CF6"/>
    <text x="92" y="172" class="eyebrow" fill="#7C3AED">COMMAND INITIALISATION</text>
    <text x="92" y="204" class="title" fill="#4C1D95">overfit ingest --course X [--path DIR] [--force] [--rebuild]</text>
    <text x="92" y="232" class="body">ensure output/index directories → optionally delete DB/WAL/SHM → probe embedding width → build IndexProfile → create or verify the store</text>
    <g>
      <rect x="1136" y="167" width="372" height="68" rx="10" fill="#FAF5FF" stroke="#E9D5FF"/>
      <text x="1154" y="188" font-size="11" font-weight="750" fill="#7E22CE">INDEX PROFILE</text>
      <text x="1154" y="209" class="code mono">schema v1 · model · dimension</text>
      <text x="1154" y="226" class="code mono">chunk size · overlap · PDF backend</text>
    </g>
  </g>

  <g id="workflow" class="sans">
    <rect x="64" y="296" width="1000" height="964" rx="18" fill="#FFFFFF" stroke="#DDD6FE"/>
    <text x="92" y="330" class="eyebrow" fill="#7C3AED">PER-FILE ORCHESTRATION · ingestion/pipeline.py</text>
    <line x1="130" y1="374" x2="130" y2="1208" stroke="#DDD6FE" stroke-width="3"/>

    <g id="step-loader">
      <circle cx="130" cy="420" r="22" fill="#7C3AED"/><text x="130" y="425" text-anchor="middle" class="num">1</text>
      <rect x="178" y="360" width="838" height="122" rx="14" fill="#FAF5FF" stroke="#DDD6FE"/>
      <text x="202" y="389" class="eyebrow" fill="#7C3AED">LOADER · DISCOVER + IDENTIFY</text>
      <text x="202" y="417" class="title" fill="#4C1D95">Recursive, filtered, deterministic paths</text>
      <text x="202" y="444" class="body">Find supported extensions, skip hidden/junk paths, sort by relative POSIX path, then SHA-256 the file in blocks.</text>
      <text x="202" y="465" class="small mono">source = path.relative_to(course_root).as_posix()</text>
    </g>

    <g id="cache-decision">
      <circle cx="130" cy="550" r="22" fill="#A78BFA"/><text x="130" y="555" text-anchor="middle" class="num">?</text>
      <rect x="178" y="505" width="838" height="90" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-dasharray="5 4"/>
      <text x="202" y="534" class="eyebrow" fill="#7C3AED">FILE CACHE GATE</text>
      <text x="202" y="561" class="body">Same <tspan class="mono">source</tspan> + same content hash + no <tspan class="mono">--force</tspan> → report <tspan font-weight="700" fill="#2563EB">cached</tspan> and skip parse, chunk, and embed.</text>
      <text x="202" y="582" class="small">A renamed path is a new source key. <tspan class="mono">--rebuild</tspan> resets the entire course index before this loop.</text>
    </g>

    <g id="step-parser">
      <circle cx="130" cy="686" r="22" fill="#7C3AED"/><text x="130" y="691" text-anchor="middle" class="num">2</text>
      <rect x="178" y="620" width="838" height="134" rx="14" fill="#FAF5FF" stroke="#DDD6FE"/>
      <text x="202" y="649" class="eyebrow" fill="#7C3AED">PARSER · EXTRACT + CLEAN</text>
      <text x="202" y="677" class="title" fill="#4C1D95">Preserve real page numbers; fail on empty extraction</text>
      <text x="202" y="704" class="body">PDF: pypdf by default, optional Docling / Docling + formula. Markdown and text use one logical page; citations print p1.</text>
      <text x="202" y="726" class="body">Cleaning removes labelled or repeated furniture, bare page numbers, and figure debris; then rejoins hyphens and normalises whitespace.</text>
      <text x="202" y="746" class="small">Docling’s structured blocks are protected from debris removal; OCR is disabled in the configured optional backend.</text>
    </g>

    <g id="step-chunker">
      <circle cx="130" cy="842" r="22" fill="#7C3AED"/><text x="130" y="847" text-anchor="middle" class="num">3</text>
      <rect x="178" y="778" width="838" height="130" rx="14" fill="#FAF5FF" stroke="#DDD6FE"/>
      <text x="202" y="807" class="eyebrow" fill="#7C3AED">CHUNKER · SEGMENT + SPLIT</text>
      <text x="202" y="835" class="title" fill="#4C1D95">Approximate tokens, humane breakpoints</text>
      <text x="202" y="862" class="body">Default target 250 tokens (~1,000 chars), overlap 25. Merge a page boundary only when both sides look continuous.</text>
      <text x="202" y="884" class="body">Prefer paragraph → line → sentence → word; snap overlap forward; fold tiny tails; drop chunks shorter than 40 chars.</text>
      <text x="202" y="902" class="small mono">Chunk(id, text, source, page, page_end?, section=None)</text>
    </g>

    <g id="step-embedder">
      <circle cx="130" cy="995" r="22" fill="#7C3AED"/><text x="130" y="1000" text-anchor="middle" class="num">4</text>
      <rect x="178" y="932" width="838" height="126" rx="14" fill="#FAF5FF" stroke="#DDD6FE"/>
      <text x="202" y="961" class="eyebrow" fill="#7C3AED">EMBEDDER · OPENAI-COMPATIBLE /v1/embeddings</text>
      <text x="202" y="989" class="title" fill="#4C1D95">Small batches, ordered responses, unit vectors</text>
      <text x="202" y="1016" class="body">Batch 16 by default; four attempts with exponential backoff. Sort API items by response index before pairing them to chunks.</text>
      <text x="202" y="1038" class="body">Normalise each vector once. Model output width is discovered, not manually configured.</text>
      <text x="202" y="1052" class="small mono">list[EmbeddedChunk] · default model bge-m3</text>
    </g>

    <g id="step-persist">
      <circle cx="130" cy="1145" r="22" fill="#D97706"/><text x="130" y="1150" text-anchor="middle" class="num">5</text>
      <rect x="178" y="1082" width="838" height="126" rx="14" fill="#FFFBEB" stroke="#FCD34D"/>
      <text x="202" y="1111" class="eyebrow" fill="#B45309">VECTOR STORE · REPLACE THIS DOCUMENT</text>
      <text x="202" y="1139" class="title" fill="#78350F">Remove old rows → add chunks/vectors → record hash</text>
      <text x="202" y="1166" class="body">The add operation replaces duplicate chunk IDs and checks every vector width. Document metadata records hash, count, and UTC time.</text>
      <text x="202" y="1188" class="small">Parse failures are reported per file and the loop continues. Successful files report <tspan font-weight="700" fill="#15803D">indexed</tspan>.</text>
    </g>
  </g>

  <g id="data-contracts" class="sans">
    <rect x="1100" y="296" width="436" height="465" rx="18" fill="#0F172A"/>
    <text x="1128" y="330" class="eyebrow" fill="#C4B5FD">DATA CONTRACTS</text>
    <text x="1128" y="362" font-size="19" font-weight="750" fill="#FFFFFF">Frozen provenance, all the way down</text>
    <g class="mono">
      <rect x="1128" y="389" width="380" height="86" rx="10" fill="#1E293B" stroke="#475569"/>
      <text x="1146" y="414" font-size="11" font-weight="700" fill="#A5B4FC">ParsedDocument</text>
      <text x="1146" y="437" class="code light">source="week03/lecture.pdf"</text>
      <text x="1146" y="457" class="code light">pages=[Page(number=12, text=...)]</text>
      <rect x="1128" y="490" width="380" height="108" rx="10" fill="#1E293B" stroke="#475569"/>
      <text x="1146" y="515" font-size="11" font-weight="700" fill="#A5B4FC">Chunk</text>
      <text x="1146" y="538" class="code light">id="week03_lecture_p12_c4"</text>
      <text x="1146" y="558" class="code light">source="week03/lecture.pdf"</text>
      <text x="1146" y="578" class="code light">page=12 · page_end=13 | None</text>
      <rect x="1128" y="613" width="380" height="78" rx="10" fill="#1E293B" stroke="#475569"/>
      <text x="1146" y="638" font-size="11" font-weight="700" fill="#A5B4FC">EmbeddedChunk</text>
      <text x="1146" y="661" class="code light">chunk=Chunk(...) · embedding=[...]</text>
      <text x="1146" y="681" class="code light">dim = probed model width</text>
    </g>
    <rect x="1128" y="711" width="380" height="28" rx="7" fill="#312E81"/>
    <text x="1318" y="730" text-anchor="middle" font-size="11" font-weight="700" fill="#E0E7FF">DATACLASSES ARE FROZEN · METADATA IS NOT MUTATED</text>
  </g>

  <g id="configuration" class="sans">
    <rect x="1100" y="789" width="436" height="226" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="1128" y="822" class="eyebrow" fill="#475569">CONFIGURATION THAT CHANGES INDEX MEANING</text>
    <g>
      <rect x="1128" y="844" width="178" height="53" rx="9" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="1144" y="865" font-size="11" font-weight="700" fill="#334155">PDF_BACKEND</text><text x="1144" y="883" class="small mono">pypdf</text>
      <rect x="1320" y="844" width="188" height="53" rx="9" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="1336" y="865" font-size="11" font-weight="700" fill="#334155">EMBED_MODEL</text><text x="1336" y="883" class="small mono">bge-m3</text>
      <rect x="1128" y="909" width="178" height="53" rx="9" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="1144" y="930" font-size="11" font-weight="700" fill="#334155">CHUNK_SIZE</text><text x="1144" y="948" class="small mono">250</text>
      <rect x="1320" y="909" width="188" height="53" rx="9" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="1336" y="930" font-size="11" font-weight="700" fill="#334155">CHUNK_OVERLAP</text><text x="1336" y="948" class="small mono">25</text>
    </g>
    <text x="1128" y="991" class="small">Changing any recorded profile value requires <tspan class="mono">--rebuild</tspan>.</text>
  </g>

  <g id="diagnostics" class="sans">
    <rect x="1100" y="1043" width="436" height="217" rx="18" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="1128" y="1076" class="eyebrow" fill="#047857">INSPECT BEFORE PAYING FOR EMBEDDINGS</text>
    <text x="1128" y="1108" class="code mono">overfit inspect --course X</text>
    <text x="1128" y="1130" class="small">Extraction counts, longest-page samples, scan warning.</text>
    <text x="1128" y="1160" class="code mono">overfit inspect --show-removed ...</text>
    <text x="1128" y="1182" class="small">Shows furniture, page numbers, and debris actually removed.</text>
    <text x="1128" y="1212" class="code mono">overfit chunks --course X</text>
    <text x="1128" y="1234" class="small">Real sizes, page-spanning count, readable chunk samples.</text>
  </g>

  <g id="footer" class="sans">
    <rect x="64" y="1294" width="1472" height="44" rx="10" fill="#F5F3FF" stroke="#DDD6FE"/>
    <text x="800" y="1321" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5B21B6">The cache avoids work only after the live embedding profile has been probed and the index has passed compatibility checks.</text>
  </g>
</svg>
